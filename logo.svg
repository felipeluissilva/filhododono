  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#gold)" stroke-width="1.4"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>

  <circle cx="21" cy="20" r="7.4" fill="url(#gold)" mask="url(#moon-mask)" opacity="0.92"/>

  <g fill="url(#gold)">
    <circle cx="76" cy="24" r="1.3"/>
    <circle cx="82" cy="34" r="0.9"/>
    <circle cx="18" cy="76" r="1"/>
    <circle cx="78" cy="72" r="1.1"/>
  </g>

  <text x="50" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="url(#gold)" text-anchor="middle">FD</text>
  <line x1="34" y1="70" x2="66" y2="70" stroke="url(#gold)" stroke-width="1" opacity="0.85"/>
  <circle cx="50" cy="70" r="1.6" fill="url(#gold)"/>
</svg>
