<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Filho do Dono">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#b79dff"/>
      <stop offset="55%" stop-color="#4b2a8f"/>
      <stop offset="100%" stop-color="#170b2e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ddb0"/>
      <stop offset="100%" stop-color="#d4af6a"/>
    </linearGradient>
    <mask id="moon-mask">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <circle cx="25" cy="21" r="6.4" fill="#000"/>
