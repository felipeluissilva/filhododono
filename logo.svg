<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Filho do Dono">
  <defs>
    <radialGradient id="bg" cx="34%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#6a3fc4"/>
      <stop offset="55%" stop-color="#3a1c78"/>
      <stop offset="100%" stop-color="#0f0720"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9edc9"/>
      <stop offset="50%" stop-color="#d4af6a"/>
      <stop offset="100%" stop-color="#9c7128"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c79a52"/>
      <stop offset="100%" stop-color="#7c5a1e"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0ddb0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f6e6bd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0ddb0" stop-opacity="0"/>
    </linearGradient>
    <filter id="emboss" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="0.9" flood-color="#050208" flood-opacity="0.65"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer glow -->
  <circle cx="50" cy="50" r="49" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.55" filter="url(#glow)"/>

  <!-- sphere body (no white, purple only) -->
  <circle cx="50" cy="50" r="47" fill="url(#bg)"/>

  <!-- coin-edge ring -->
  <circle cx="50" cy="50" r="44.3" fill="none" stroke="url(#gold)" stroke-width="0.6" stroke-dasharray="1.6 2.4" opacity="0.5"/>

  <!-- mane: radiating gold flames around center -->
  <g filter="url(#emboss)">
    <g id="flame">
      <path d="M 50 33 C 46.5 25 45.5 15 50 6.5 C 54.5 15 53.5 25 50 33 Z" fill="url(#gold)"/>
    </g>
    <use href="#flame" transform="rotate(24 50 50)"/>
    <use href="#flame" transform="rotate(48 50 50)" fill="url(#goldDark)" opacity="0.9"/>
    <use href="#flame" transform="rotate(72 50 50)"/>
    <use href="#flame" transform="rotate(96 50 50)" fill="url(#goldDark)" opacity="0.9"/>
    <use href="#flame" transform="rotate(120 50 50)"/>
    <use href="#flame" transform="rotate(144 50 50)" fill="url(#goldDark)" opacity="0.9"/>
    <use href="#flame" transform="rotate(168 50 50)"/>
    <use href="#flame" transform="rotate(192 50 50)" fill="url(#goldDark)" opacity="0.9"/>
    <use href="#flame" transform="rotate(216 50 50)"/>
    <use href="#flame" transform="rotate(240 50 50)" fill="url(#goldDark)" opacity="0.9"/>
    <use href="#flame" transform="rotate(264 50 50)"/>
    <use href="#flame" transform="rotate(288 50 50)" fill="url(#goldDark)" opacity="0.9"/>
    <use href="#flame" transform="rotate(312 50 50)"/>
    <use href="#flame" transform="rotate(336 50 50)" fill="url(#goldDark)" opacity="0.9"/>
  </g>

  <!-- bevel rings -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#gold)" stroke-width="1.6" filter="url(#emboss)"/>

  <!-- lion face -->
  <circle cx="50" cy="49" r="15.5" fill="url(#gold)" filter="url(#emboss)"/>

  <!-- ears -->
  <circle cx="39" cy="38" r="4.6" fill="url(#gold)"/>
  <circle cx="61" cy="38" r="4.6" fill="url(#gold)"/>
  <circle cx="39" cy="38.5" r="2.3" fill="#3a1c78" opacity="0.5"/>
  <circle cx="61" cy="38.5" r="2.3" fill="#3a1c78" opacity="0.5"/>

  <!-- face shading -->
  <path d="M 50 40 Q 40 44 41 54 Q 44 62 50 63 Q 56 62 59 54 Q 60 44 50 40 Z" fill="#3a1c78" opacity="0.14"/>

  <!-- eyes -->
  <ellipse cx="43.6" cy="47" rx="2.6" ry="2" fill="#0f0720"/>
  <ellipse cx="56.4" cy="47" rx="2.6" ry="2" fill="#0f0720"/>
  <circle cx="42.9" cy="46.4" r="0.6" fill="#fff" opacity="0.85"/>
  <circle cx="55.7" cy="46.4" r="0.6" fill="#fff" opacity="0.85"/>

  <!-- brow shading -->
  <path d="M 40 44 Q 43.5 42 47 43.5" stroke="#3a1c78" stroke-width="0.9" fill="none" opacity="0.5"/>
  <path d="M 60 44 Q 56.5 42 53 43.5" stroke="#3a1c78" stroke-width="0.9" fill="none" opacity="0.5"/>

  <!-- nose + muzzle -->
  <path d="M 47 52.5 L 53 52.5 L 50 56.5 Z" fill="#3a1c78"/>
  <path d="M 50 56.5 L 50 60" stroke="#3a1c78" stroke-width="0.9"/>
  <path d="M 50 60 Q 45.5 62.5 42.5 60.5" stroke="#3a1c78" stroke-width="0.9" fill="none" opacity="0.7"/>
  <path d="M 50 60 Q 54.5 62.5 57.5 60.5" stroke="#3a1c78" stroke-width="0.9" fill="none" opacity="0.7"/>

  <!-- whiskers dots -->
  <g fill="#3a1c78" opacity="0.6">
    <circle cx="41" cy="57" r="0.5"/>
    <circle cx="39.5" cy="59.5" r="0.5"/>
    <circle cx="41.5" cy="61.5" r="0.5"/>
    <circle cx="59" cy="57" r="0.5"/>
    <circle cx="60.5" cy="59.5" r="0.5"/>
    <circle cx="58.5" cy="61.5" r="0.5"/>
  </g>

  <!-- FD ribbon -->
  <path d="M 33 70 Q 50 65 67 70 L 67 78 Q 50 74 33 78 Z" fill="url(#bg)" stroke="url(#gold)" stroke-width="1" filter="url(#emboss)"/>
  <text x="50" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="9.5" font-weight="700"
        fill="url(#gold)" text-anchor="middle">FD</text>

  <!-- stars -->
  <g fill="url(#gold)" opacity="0.8">
    <circle cx="16" cy="20" r="0.9"/>
    <circle cx="84" cy="22" r="0.7"/>
    <circle cx="86" cy="66" r="0.8"/>
  </g>

  <!-- glossy highlight -->
  <path d="M 13 30 A 41 41 0 0 1 71 9" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.1"/>

  <!-- shine sweep -->
  <rect x="0" y="0" width="100" height="100" fill="url(#goldSoft)" opacity="0.04"/>
</svg>
